version: 2

updates:
  # npm dependencies for the Next.js app
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      include: scope
    # Only patch + minor automatically. Major bumps are noisy & risky — review manually.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    # Group related updates so review is one PR, not ten.
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      next:
        patterns:
          - 'next'
          - 'next-themes'
          - '@vercel/*'
      web3:
        patterns:
          - 'ethers'
          - 'viem'
          - 'wagmi'
          - '@rainbow-me/*'
      types:
        patterns:
          - '@types/*'

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(actions)
