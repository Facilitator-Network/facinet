name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'facinet-sdk/**'
      - '**.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  push:
    branches: [main, dev]
    paths-ignore:
      - 'facinet-sdk/**'
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Generate Next.js route types so tsc can resolve `.next/types/**`
      # without needing a full build (which currently has a prerender
      # bug — see Sprint 1 backlog).
      - name: Generate route types
        run: npx next typegen
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_placeholder
          NEXT_PUBLIC_FACILITATOR_URL: http://localhost:3000
          NEXT_PUBLIC_PAYMENT_RECIPIENT: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_PAYMENT_AMOUNT: '1'
          NEXT_PUBLIC_DEFAULT_NETWORK: avalanche-fuji

      - name: Typecheck
        run: npm run typecheck

      # Build is intentionally omitted from CI for now. There is a
      # pre-existing prerender bug (localStorage access during SSG)
      # that fails `next build` locally. Vercel's own build still gates
      # production deploys. Re-enable this step after the bug is fixed.
      #
      # Lint is also omitted: Next 16 dropped `next lint`. ESLint setup
      # is a follow-up PR.
